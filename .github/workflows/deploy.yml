name: Deploy

# Publishing is driven from here, but the deploy workflow itself has to live in
# shwaaa21/shwaaa21.github.io because the Pages API only accepts deployments
# from the repo where Pages is enabled. This workflow's job is to tell that repo
# a new commit is ready.
on:
  push:
    branches:
      - personal-site
  workflow_dispatch:

permissions:
  contents: read

# One dispatch in flight at a time. queue rather than cancel: a superseded run
# still has a live Pages deployment to finish.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  dispatch:
    name: Notify Pages repo
    runs-on: ubuntu-latest
    steps:
      # secrets.* is not available in an if: condition at any scope, so the
      # presence check happens here, in a step's env, and publishes an output
      # the dispatch step can gate on. Without this the workflow file is
      # rejected outright, and a missing token fails every push.
      - name: Check whether the dispatch token is configured
        id: pat
        env:
          PAGES_DISPATCH_TOKEN: ${{ secrets.PAGES_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          # Default rather than bare reference: an Actions env entry is set but
          # empty when the secret is missing, and -u would abort on that.
          token="${PAGES_DISPATCH_TOKEN:-}"
          if [ -n "$token" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy::PAGES_DISPATCH_TOKEN is not set, so pushes will not deploy automatically. Add a fine-grained PAT with Actions: Read and write on shwaaa21/shwaaa21.github.io, or deploy by hand from that repo's Actions tab."
          fi
          # Shape only, never any part of the token itself, so a run can
          # distinguish a missing secret from a malformed value. Only the
          # length and the recognised prefix are reported.
          case "$token" in
            github_pat_*) kind="fine-grained PAT" ;;
            ghp_*)        kind="classic PAT" ;;
            *)            kind="unrecognised" ;;
          esac
          echo "PAGES_DISPATCH_TOKEN: length ${#token}, looks like: $kind" >> "$GITHUB_STEP_SUMMARY"

      # Actions: write on the target is what this endpoint requires, which is
      # why the token needs that permission rather than Contents: write (the
      # latter is for repository_dispatch, a different endpoint). The target's
      # own workflow gates the publish behind a build, so there is no way to
      # deploy a commit that does not compile.
      - name: Trigger deploy in the Pages repo
        if: steps.pat.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAGES_DISPATCH_TOKEN }}
        run: |
          set -uo pipefail

          # Capture stderr and the status code rather than letting gh exit
          # silently: a 403 from a mis-scoped token and a 422 from a workflow
          # file that predates an input both fail this step, and only the
          # response body says which. The body can contain no secret, only
          # GitHub's own error text, so it is safe to surface.
          out="$(mktemp)"
          status=0
          gh api "repos/shwaaa21/shwaaa21.github.io/actions/workflows/deploy.yml/dispatches" \
            --method POST \
            --field ref=main \
            --field "inputs[ref]=${GITHUB_REF_NAME}" \
            --field "inputs[sha]=${GITHUB_SHA}" >"$out" 2>&1 || status=$?

          {
            echo "### Trigger result"
            echo
            echo "- status: \`$status\`"
            echo "- endpoint: \`POST /repos/shwaaa21/shwaaa21.github.io/actions/workflows/deploy.yml/dispatches\`"
            echo "- token: ${#GH_TOKEN} chars, $(case "$GH_TOKEN" in github_pat_*) echo fine-grained ;; ghp_*) echo classic ;; *) echo unrecognised ;; esac)"
            echo
            echo '```'
            cat "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$status" -ne 0 ]; then
            echo "::error::gh api failed with status $status (see the step summary)"
            cat "$out" >&2
          fi
          rm -f "$out"
          exit "$status"
