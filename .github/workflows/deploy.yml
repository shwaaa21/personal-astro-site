name: Deploy to GitHub Pages

on:
  push:
    branches:
      - personal-site
  workflow_dispatch:

# Pages deploys from the artifact produced below, authenticated by an OIDC token
# rather than a stored credential. id-token: write is what mints that token;
# pages: write is what allows publishing it.
permissions:
  contents: read
  pages: write
  id-token: write

# Pages serves one deployment at a time, so a newer push supersedes any run
# still in flight.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    # GitHub reads the URL and name back from the environment so the deploy
    # shows up on the Pages settings page.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
